<template>
    
    <lightning-card title="Lightning Record Page" icon-name="standard:contact">
        <div class = "slds-m-around_medium">
            <lightning-record-edit-form record-id={recordId} object-api-name="Contact" onsuccess={successHandler} onerror={errorHandler}>

                <lightning-input-field field-name="FirstName"></lightning-input-field>
                <lightning-input-field field-name="LastName" required></lightning-input-field>
                <lightning-input-field field-name="Phone"></lightning-input-field>
                <lightning-input-field field-name="Department"></lightning-input-field>
                <lightning-input-field field-name="Title"></lightning-input-field>
                <div class="slds-m-top_medium">
                    <lightning-button-group class = "slds-align_absolute-center">
                        <lightning-button label="Save" onclick={saveHandler} variant="brand" type="submit"></lightning-button>
                        <lightning-button label="Clear" onclick={clearHandler} variant="destructive" type="reset"></lightning-button>
                    </lightning-button-group>
                </div>
            </lightning-record-edit-form>
        </div>
    </lightning-card>
</template>
