<template>
    <lightning-card title="Contact Profile Card" icon-name="utility:user">
        <div class="slds-p-around_medium">
            <div class= "slds-grid slds-wrap slds-gutters">

                <!-- Photo div -->
                <div class= "slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-align_absolute-center">
                    <template lwc:if={photoUrl}>
                        <img src={photoUrl} alt="Contact Photo">
                    </template>

                    <template lwc:else>
                            <lightning-avatar fallback-icon-name="standard:contact" size="large"> </lightning-avatar>
                        </template>
                </div>

                <!-- Contact Details -->

                <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-4">

                    <lightning-output-field field-name="Name"></lightning-output-field>
                    <h1>Name : {fullName}</h1>
                    <p>Title : {title} </p>
                    <p>Department : {department}</p>
                    <p> Email : 
                        <template lwc:if={email}>
                            <a href={emailLink}> {email} </strong>
                            </a>
                        </template>
                        <template lwc:else>
                            Email Not Available
                        </template>
                    </p>
                    <p> Phone : 
                        <template lwc:if={phone}>
                            <a href={phoneLink}> {Phone} </strong>
                            </a>
                        </template>
                        <template lwc:else>
                            Phone Not Available
                        </template>
                    </p>
                    <p>Account : {accountName}</p>
                </div>

            </div>
        </div>
</lightning-card>
</template>
