<template>
    <div class="slds-p-around_medium">
        <div class="slds-box slds-theme_default slds-m-bottom_medium">
            <lightning-card title="1st Lightning Record View Form">
                <lightning-record-view-form record-id={recordId} object-api-name="Account">

                    <lightning-output-field field-name="Name"></lightning-output-field>
                    <lightning-output-field field-name="Phone"></lightning-output-field>
                    <lightning-output-field field-name="Fax"></lightning-output-field>
                    <lightning-output-field field-name="Industry"></lightning-output-field>
                    <lightning-output-field field-name="Rating"></lightning-output-field>
                    <lightning-output-field field-name="BillingCity"></lightning-output-field>

                    No edit possible coz it's View only
                    <!-- <lightning-button label="Clear" onclick={clearFunc1}></lightning-button> -->
                </lightning-record-view-form>
            </lightning-card>
        </div>

        <!-- This is Record Edit Form -->

        <div class="slds-box slds-theme_default">
            <lightning-card title="2nd Lightning Record View Form">
                <lightning-record-edit-form record-id={recordId} object-api-name="Account">

                    <lightning-input-field field-name="Name"></lightning-input-field>
                    <lightning-input-field field-name="Phone"></lightning-input-field>
                    <lightning-input-field field-name="Industry"></lightning-input-field>
                    <lightning-input-field field-name="Rating"></lightning-input-field>
                    <lightning-input-field field-name="Description"></lightning-input-field>

                    <lightning-button label="Clear" onclick={clearFunc2}></lightning-button>
                    <lightning-button type="submit" label="Save"></lightning-button>
                </lightning-record-edit-form>
            </lightning-card>
        </div>
    </div>
    
</template>
